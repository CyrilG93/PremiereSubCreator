name: Build macOS Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Full ARM64 PKG to the matching stable GitHub release
        required: true
        type: boolean
        default: false

# // The manual workflow builds only the complete Apple Silicon installer.
permissions:
  contents: write

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS Full ARM64 PKG
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm the Apple Silicon runner
        shell: bash
        run: |
          # // Stop immediately if GitHub ever changes this runner label to Intel.
          test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Restore the validated private runtime
        uses: actions/cache@v5
        with:
          # // Cache only reusable ARM64 runtime inputs; the public artifact remains the Full PKG.
          path: |
            .subcreator-macos-staging/runtime
            .subcreator-macos-staging/downloads
          key: subcreator-macos-arm64-runtime-${{ hashFiles('scripts/subcreator-package-macos-pkg.mjs', 'installers/macos-runtime.json') }}

      - name: Install project dependencies
        run: npm ci

      - name: Verify the project
        run: npm run subcreator:verify

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          # // Derive the artifact and release names from the single package version source.
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json contains an invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build the macOS Full ARM64 installer
        env:
          # // Rebuild from validated cached components because the legacy runtime release asset no longer exists.
          SUBCREATOR_REBUILD_RUNTIME: "1"
          SUBCREATOR_REUSE_STAGING: "1"
        run: npm run subcreator:package:macos-pkg

      - name: Validate the generated Full ARM64 PKG
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # // Verify the filename, embedded product version, architecture declaration, structure, and hash.
          installer_path="Releases/SubCreator-v${VERSION}-macOS-Installer-arm64.pkg"
          if [[ ! -f "$installer_path" ]]; then
            echo "Full macOS installer is missing: $installer_path" >&2
            exit 1
          fi

          validation_root="$(mktemp -d)"
          expanded_path="$validation_root/expanded"
          pkgutil --expand "$installer_path" "$expanded_path"
          grep -Fq "hostArchitectures=\"arm64\"" "$expanded_path/Distribution"
          grep -Fq "version=\"${VERSION}\"" "$expanded_path/Distribution"
          if grep -Eq "x86_64|i386" "$expanded_path/Distribution"; then
            echo "Intel architecture found in the ARM64 installer distribution." >&2
            exit 1
          fi

          shasum -a 256 "$installer_path"
          echo "installer_path=$installer_path" >> "$GITHUB_OUTPUT"

      - name: Upload the Full ARM64 installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: SubCreator-v${{ steps.release.outputs.version }}-macOS-Installer-arm64
          path: ${{ steps.artifact.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish the Full ARM64 installer
        if: inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_PATH: ${{ steps.artifact.outputs.installer_path }}
        run: |
          # // Remove lower semantic prereleases and their tags before publishing the stable release.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.prerelease == true) | .tag_name' | while IFS= read -r tag; do
            if [[ "$tag" =~ ^[vV]([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              candidate="${BASH_REMATCH[1]}"
              lowest="$(printf '%s\n%s\n' "$candidate" "$VERSION" | sort -V | head -n 1)"
              if [[ "$candidate" != "$VERSION" && "$lowest" == "$candidate" ]]; then
                gh release delete "$tag" --cleanup-tag --yes
              fi
            fi
          done

          # // Reuse a same-version release regardless of tag casing, so promoting a prerelease never duplicates its assets.
          matching_release="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select((.tag_name | ascii_downcase) == \"${RELEASE_TAG}\") | [.tag_name, (.prerelease | tostring)] | @tsv" | head -n 1)"
          if [[ -n "$matching_release" ]]; then
            IFS=$'\t' read -r matching_tag matching_is_prerelease <<< "$matching_release"
            if [[ "$matching_is_prerelease" == "true" ]]; then
              gh release edit "$matching_tag" --prerelease=false --title "Sub Creator $VERSION"
            fi
            RELEASE_TAG="$matching_tag"
          fi

          # // Create the stable release when no matching release already exists, then upload only the Full ARM64 macOS asset.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Sub Creator $VERSION" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$INSTALLER_PATH" --clobber
