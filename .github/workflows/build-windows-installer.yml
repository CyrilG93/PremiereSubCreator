name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Full EXE to the matching stable GitHub release
        required: true
        type: boolean
        default: false

# // The manual workflow publishes only the complete Windows installer.
permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows Full EXE
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify the project
        run: npm run subcreator:verify

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          # // Derive the artifact and release names from the single package version source.
          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json contains an invalid release version: $version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build the Windows Full installer
        run: npm run subcreator:package:windows-exe

      - name: Validate the generated Full EXE
        id: artifact
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # // Fail before upload when the complete installer or its embedded version is wrong.
          $installerPath = "Releases/SubCreator-v$env:VERSION-Windows-Full-Installer.exe"
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Full Windows installer is missing: $installerPath"
          }

          $productVersion = ([System.Diagnostics.FileVersionInfo]::GetVersionInfo($installerPath).ProductVersion).Trim()
          if ($productVersion -ne $env:VERSION) {
            throw "Full installer version mismatch: expected $env:VERSION, got $productVersion"
          }

          Get-FileHash -Algorithm SHA256 -LiteralPath $installerPath
          "installer_path=$installerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload the Full installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: SubCreator-v${{ steps.release.outputs.version }}-Windows-Full-Installer
          path: ${{ steps.artifact.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish the Full installer
        if: inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_PATH: ${{ steps.artifact.outputs.installer_path }}
        run: |
          # // Remove lower semantic prereleases and their tags before publishing the stable release.
          $currentVersion = [version]$env:VERSION
          $prereleases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" `
            --jq '.[] | select(.prerelease == true) | [.tag_name] | @tsv'
          foreach ($tag in @($prereleases)) {
            $candidate = [string]$tag
            if ($candidate -match '^[vV](\d+\.\d+\.\d+)$' -and [version]$Matches[1] -lt $currentVersion) {
              gh release delete $candidate --cleanup-tag --yes
            }
          }

          # // Create the stable release when needed, then upload only the Full Windows asset.
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --target $env:GITHUB_SHA `
              --title "Sub Creator $env:VERSION" `
              --generate-notes
          }
          gh release upload $env:RELEASE_TAG $env:INSTALLER_PATH --clobber
